name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Serialize the read/compare/promote and downstream dispatch across all release tags.
concurrency:
  group: agr-release-distribution
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Validate tag and select release channel
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-channel.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse to rewrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          RELEASES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft] | @tsv')"
          if printf '%s\n' "$RELEASES" | awk -v tag="$TAG" '$1 == tag && $2 == "false" { found = 1 } END { exit !found }'; then
            echo "Release $TAG is already published; retry downstream delivery without rebuilding this tag." >&2
            exit 1
          fi

      - name: Validate changelog entry
        run: |
          bash scripts/changelog.sh validate-pair "${{ steps.version.outputs.version }}"
          bash scripts/changelog.sh validate-release-notes-pair "${{ steps.version.outputs.version }}"

      - name: Extract release notes from changelog
        run: bash scripts/changelog.sh extract "${{ steps.version.outputs.version }}" RELEASE_NOTES.md

      - name: Validate all effective API metadata
        run: go run ./cmd/internal/apipatch check-all

      - name: Validate API generator outputs are up to date
        run: go run ./cmd/internal/cobragen check

      - name: Mapping and validator unit tests
        run: go test ./internal/apimeta/... -count=1

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            bin="agr"
            if [ "$GOOS" = "windows" ]; then ext=".zip"; bin="agr.exe"; fi
            work="dist/agr-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "$work"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags "$LDFLAGS" -o "$work/$bin" ./cmd/agr
            if [ "$GOOS" = "windows" ]; then
              (cd "$work" && zip -q "../agr-${VERSION}-${GOOS}-${GOARCH}${ext}" "$bin")
            else
              tar -C "$work" -czf "dist/agr-${VERSION}-${GOOS}-${GOARCH}.tar.gz" "$bin"
            fi
            rm -rf "$work"
          done
          cp install.sh dist/install.sh
          (cd dist && shasum -a 256 -- * > checksums.txt)

      - name: Install smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "dist/agr-${VERSION}-linux-amd64.tar.gz" -C /tmp
          /tmp/agr version
          /tmp/agr version -o json | tee /tmp/agr-version.json
          grep -q "\"Version\":\"${VERSION}\"" /tmp/agr-version.json
          # Guard against dynamic glibc linkage regressing on release binaries
          # (see fix for GLIBC_2.34 not found on older Linux distros).
          file /tmp/agr | grep -q 'statically linked'
          # `agr api list-actions` was removed in §9.4 in favour of
          # `agr schema` for user-facing introspection; smoke a known
          # mapped command instead.
          /tmp/agr schema instance.create -o json | grep -q '"Name":"instance.create"'
          test -f dist/install.sh
          test -f dist/checksums.txt
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=".tar.gz"
            if [ "$GOOS" = "windows" ]; then EXT=".zip"; fi
            ARTIFACT="agr-${VERSION}-${GOOS}-${GOARCH}${EXT}"
            test -f "dist/${ARTIFACT}"
            grep -q "  ${ARTIFACT}$" dist/checksums.txt
          done

      - name: Create draft GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: "false"
          files: |
            dist/*

      # Publish only after all assets exist, so release.published consumers can sync them.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          if [[ "$CHANNEL" == "stable" ]]; then
            LATEST="$(python3 scripts/release-latest.py "$TAG")"
            gh release edit "$TAG" --draft=false --latest="$LATEST"
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi

  homebrew:
    needs: release
    if: ${{ needs.release.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Re-evaluate on retries: a newer release may have completed in the meantime.
      - name: Check Homebrew target is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ELIGIBLE="$(python3 scripts/release-latest.py "$TAG")"
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"

      - name: Create Homebrew Tap app token
        if: ${{ steps.current.outputs.eligible == 'true' }}
        id: homebrew-tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: TencentCloudAgentRuntime
          repositories: homebrew-tap
          permission-actions: write

      - name: Trigger Homebrew Tap update
        if: ${{ steps.current.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh workflow run update-agr-cli.yml \
            --repo TencentCloudAgentRuntime/homebrew-tap \
            --ref main \
            --field version="$TAG"
