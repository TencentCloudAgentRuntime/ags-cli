name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Extract version and release channel from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            CHANNEL="stable"
            SOURCE_BRANCH="main"
            PRERELEASE="false"
            MAKE_LATEST="legacy"
            CHANGELOG_FILE="CHANGELOG.md"
            ZH_CHANGELOG_FILE="CHANGELOG-zh.md"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-preview\.([1-9][0-9]*)$ ]]; then
            CORE_VERSION="${BASH_REMATCH[1]}"
            VERSION="${CORE_VERSION}-preview.${BASH_REMATCH[2]}"
            CHANNEL="preview"
            SOURCE_BRANCH="preview"
            PRERELEASE="true"
            MAKE_LATEST="false"
            CHANGELOG_FILE="CHANGELOG-preview.md"
            ZH_CHANGELOG_FILE="CHANGELOG-preview-zh.md"

            bash scripts/release-policy.sh validate-preview-core "$CORE_VERSION"
          else
            echo "Error: Invalid tag format '$TAG'"
            echo "Expected format: vX.Y.Z or vX.Y.Z-preview.N (N >= 1)"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "source_branch=$SOURCE_BRANCH"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "changelog_file=$CHANGELOG_FILE"
            echo "zh_changelog_file=$ZH_CHANGELOG_FILE"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG uses channel $CHANNEL from branch $SOURCE_BRANCH"

      - name: Verify release source pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.version.outputs.source_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          RELEASE_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor \
            "$RELEASE_COMMIT" "refs/remotes/origin/${SOURCE_BRANCH}"; then
            echo "Error: release commit $RELEASE_COMMIT is not on $SOURCE_BRANCH"
            exit 1
          fi

          PULLS_JSON="$(mktemp)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_COMMIT}/pulls" \
            > "$PULLS_JSON"
          bash scripts/release-policy.sh validate-release-pr \
            "$RELEASE_COMMIT" "$SOURCE_BRANCH" "$TAG" "$PULLS_JSON"

      - name: Validate changelog entry
        env:
          CHANGELOG_FILE: ${{ steps.version.outputs.changelog_file }}
          ZH_CHANGELOG_FILE: ${{ steps.version.outputs.zh_changelog_file }}
        run: |
          bash scripts/changelog.sh validate-pair "${{ steps.version.outputs.version }}"
          bash scripts/changelog.sh validate-release-notes-pair "${{ steps.version.outputs.version }}"

      - name: Extract release notes from changelog
        env:
          CHANGELOG_FILE: ${{ steps.version.outputs.changelog_file }}
        run: bash scripts/changelog.sh extract "${{ steps.version.outputs.version }}" RELEASE_NOTES.md

      - name: Validate API release policy
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          if [ "$CHANNEL" = "stable" ]; then
            go run ./cmd/internal/apipatch check-all --require-empty
          else
            go run ./cmd/internal/apipatch check-all
          fi

      - name: Validate API generator outputs are up to date
        run: go run ./cmd/internal/cobragen check

      - name: Mapping and validator unit tests
        run: go test ./internal/apimeta/... -count=1

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            bin="agr"
            if [ "$GOOS" = "windows" ]; then ext=".zip"; bin="agr.exe"; fi
            work="dist/agr-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "$work"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags "$LDFLAGS" -o "$work/$bin" ./cmd/agr
            if [ "$GOOS" = "windows" ]; then
              (cd "$work" && zip -q "../agr-${VERSION}-${GOOS}-${GOARCH}${ext}" "$bin")
            else
              tar -C "$work" -czf "dist/agr-${VERSION}-${GOOS}-${GOARCH}.tar.gz" "$bin"
            fi
            rm -rf "$work"
          done
          (cd dist && shasum -a 256 -- * > checksums.txt)
          cp install.sh dist/install.sh

      - name: Install smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "dist/agr-${VERSION}-linux-amd64.tar.gz" -C /tmp
          /tmp/agr version
          /tmp/agr version -o json | tee /tmp/agr-version.json
          grep -q "\"Version\":\"${VERSION}\"" /tmp/agr-version.json
          # Guard against dynamic glibc linkage regressing on release binaries
          # (see fix for GLIBC_2.34 not found on older Linux distros).
          file /tmp/agr | grep -q 'statically linked'
          # `agr api list-actions` was removed in §9.4 in favour of
          # `agr schema` for user-facing introspection; smoke a known
          # mapped command instead.
          /tmp/agr schema instance.create -o json | grep -q '"Name":"instance.create"'
          test -f dist/install.sh
          test -f dist/checksums.txt
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=".tar.gz"
            if [ "$GOOS" = "windows" ]; then EXT=".zip"; fi
            ARTIFACT="agr-${VERSION}-${GOOS}-${GOARCH}${EXT}"
            test -f "dist/${ARTIFACT}"
            grep -q "  ${ARTIFACT}$" dist/checksums.txt
          done

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          files: |
            dist/*

      - name: Create Homebrew Tap app token
        if: ${{ steps.version.outputs.channel == 'stable' }}
        id: homebrew-tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: TencentCloudAgentRuntime
          repositories: homebrew-tap
          permission-actions: write

      - name: Trigger Homebrew Tap update
        if: ${{ steps.version.outputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run update-agr-cli.yml \
            --repo TencentCloudAgentRuntime/homebrew-tap \
            --ref main \
            --field version="$TAG"
