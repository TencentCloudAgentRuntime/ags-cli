name: CI

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: Pull Request Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi

          pattern='^(feat|fix|docs|style|refactor|test|chore)(\([^()]*[^()[:space:]][^()]*\))?!?: [^[:space:]].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            exit 0
          fi

          echo "::error title=Invalid pull request title::Expected '<type>(<scope>)!: <description>' (scope and ! are optional). Allowed types: feat, fix, docs, style, refactor, test, chore."
          echo "Examples:"
          echo "  feat(tool): support computer configuration"
          echo "  fix: handle an empty response"
          echo "  feat(api)!: remove the legacy request format"
          echo "Actual title: $PR_TITLE"
          exit 1

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          DIFF=$(gofmt -d .)
          if [ -n "$DIFF" ]; then
            echo "The following files are not formatted:"
            echo "$DIFF"
            exit 1
          fi

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test one-line installer
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            system_bin_mode="$(stat -c '%a' /usr/local/bin)"
            trap 'sudo chmod "$system_bin_mode" /usr/local/bin' EXIT
            sudo chmod a-w /usr/local/bin
            sh scripts/test-install.sh --require-fallback
          else
            sh scripts/test-install.sh
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  changelog-gate:
    name: Changelog Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate changelog structure
        run: |
          bash scripts/changelog.sh validate
          bash scripts/changelog.sh validate-latest-release-notes-pair
          CHANGELOG_FILE=CHANGELOG-preview.md \
            ZH_CHANGELOG_FILE=CHANGELOG-preview-zh.md \
            bash scripts/changelog.sh validate-optional-release-notes-pair

      - name: Test release policy
        run: bash scripts/test-release-policy.sh

  generator-gate:
    name: API Generator Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Validate all effective API metadata
        run: go run ./cmd/internal/apipatch check-all

      - name: Require canonical API metadata on main
        if: >-
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'push' && github.ref_name == 'main')
        run: go run ./cmd/internal/apipatch check-all --require-empty

      - name: Mapping invariants
        run: go test ./internal/apimeta/... -count=1

      - name: Cobra flag contract (generated flags exist on commands)
        run: go test ./cmd/agr -run "TestContract_GeneratedFlagsArePresentOnCobraCommands|TestContract_RequestFlagOnEveryMappedRequestCommand" -count=1

      - name: Command metadata contracts
        run: go test ./internal/commands/... -count=1

      - name: Generator outputs are up to date
        run: go run ./cmd/internal/cobragen check

      - name: Docs and man pages can be regenerated
        # docs/ and man/ are NOT tracked in the repo; they are generated
        # artifacts produced by the maintainer-only docgen tool
        # (NextPlan §9.5). This step verifies the generation still
        # works without requiring a baseline in the source tree and
        # without exposing a user-facing `agr docs` command.
        run: |
          set -euo pipefail
          tmpdocs="$(mktemp -d)"
          tmpman="$(mktemp -d)"
          go run ./cmd/internal/docgen markdown --dir "$tmpdocs"
          go run ./cmd/internal/docgen man --dir "$tmpman"
          test -n "$(find "$tmpdocs" -mindepth 1 -maxdepth 1 -type f -print -quit)"
          test -n "$(find "$tmpman" -mindepth 1 -maxdepth 1 -type f -print -quit)"

  overlay-smoke:
    name: CLI Overlay Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Overlay create -> execute -> cleanup tests
        run: |
          go test ./internal/cli -run "TestResolveOverlay|TestOverlay_TempInstance|TestOverlay_InstanceExecTempLifecycleIntegration|TestOverlay_PreExecutionFailureForcesCleanup" -count=1 -v

  integ-tests:
    name: Integration Tests (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run credential-free integration tests
        run: go test ./tests/integ/ -v -count=1 -timeout 30s

  release-ready:
    name: Release Ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: |
          set -euo pipefail
          mkdir -p build
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -ldflags "-X main.Version=ci-$(date +%s) -X main.Commit=$(git rev-parse --short HEAD) -X main.BuildTime=$(date -u +%FT%TZ)" -o "build/agr-${os}-${arch}" ./cmd/agr
            done
          done
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=ci-$(date +%s) -X main.Commit=$(git rev-parse --short HEAD) -X main.BuildTime=$(date -u +%FT%TZ)" -o build/agr-windows-amd64.exe ./cmd/agr

      - name: agr version smoke test
        run: |
          go build -ldflags "-X main.Version=v0.0.0-ci -X main.Commit=$(git rev-parse --short HEAD) -X main.BuildTime=$(date -u +%FT%TZ)" -o agr-smoke ./cmd/agr
          ./agr-smoke version
          ./agr-smoke version -o json | grep -q '"Version":"v0.0.0-ci"'
          # api list-actions / coverage are maintainer-only (NextPlan §9.4);
          # smoke a known mapped resource command via `agr schema` instead.
          ./agr-smoke schema instance.create -o json | grep -q '"Name":"instance.create"'

  # Keep this display name stable: the default-branch ruleset requires it.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - pr-title
      - workflow-lint
      - fmt
      - test
      - lint
      - changelog-gate
      - generator-gate
      - overlay-smoke
      - integ-tests
      - release-ready
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required CI jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
