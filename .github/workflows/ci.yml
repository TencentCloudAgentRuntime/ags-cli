name: CI

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# Give main/master and tags a unique group so even pending commits cannot be
# superseded. Feature branches and PRs only need their newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'master' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'master') }}

jobs:
  changes:
    name: Changes and Pull Request Title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Main and release tags always get a complete validation run.
      ci: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref_type == 'tag' || steps.filter.outputs.code == 'true' || steps.filter.outputs.changelog == 'true' }}
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|chore)(\([^()]*[^()[:space:]][^()]*\))?!?: [^[:space:]].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            exit 0
          fi

          echo "::error title=Invalid pull request title::Expected '<type>(<scope>)!: <description>' (scope and ! are optional). Allowed types: feat, fix, docs, style, refactor, test, chore."
          echo "Examples:"
          echo "  feat(tool): support computer configuration"
          echo "  fix: handle an empty response"
          echo "  feat(api)!: remove the legacy request format"
          echo "Actual title: $PR_TITLE"
          exit 1

      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request'

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Pushes compare the complete push with its previous tip; PRs use the
          # complete PR diff, including code from earlier pushes.
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!man/**'
            changelog:
              - 'CHANGELOG*.md'

  checks:
    name: Workflow, Format and Release Checks
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check workflow files
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 predates concurrency.queue support.
          "$RUNNER_TEMP/actionlint" -color -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # gofmt uses neither dependencies nor compiled packages. Saving its
          # empty cache would prevent build/test jobs from populating that key.
          cache: false

      - name: Check gofmt
        run: |
          DIFF=$(gofmt -d .)
          if [ -n "$DIFF" ]; then
            echo "The following files are not formatted:"
            echo "$DIFF"
            exit 1
          fi

      - name: Validate changelog structure
        run: |
          bash scripts/changelog.sh validate
          bash scripts/changelog.sh validate-latest-release-notes-pair

      - name: Test release channel routing (no credentials)
        run: python3 scripts/test-release.py

      - name: Test CI gates and shard completeness
        run: python3 scripts/test-ci.py

  test:
    name: Unit Tests (${{ matrix.os }}, ${{ matrix.channel }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        channel: [stable, preview]
        shard: [unit, scenarios]
    env:
      GOFLAGS: ${{ matrix.channel == 'preview' && '-tags=preview' || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Separate race/coverage caches from formatting, native builds and
          # the other shard/channel. Keep setup-go's module/build cache support.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
            ${{ matrix.channel == 'preview' && 'internal/apimeta/build_channel_preview.go' || 'internal/apimeta/build_channel.go' }}
            ${{ matrix.shard == 'unit' && 'cmd/agr/*_test.go' || 'internal/patchscenarios/*_test.go' }}

      - name: Run tests
        env:
          CI_TEST_SHARD: ${{ matrix.shard }}
        run: bash scripts/ci-tests.sh "$CI_TEST_SHARD"

  archive-compatibility:
    name: Archived Runner Go 1.26 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go 1.26 for archive compatibility
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
            cmd/internal/patch-e2e/*_test.go

      - name: Test archived runner with Go 1.26 (no cloud credentials)
        run: |
          go test -v -race ./cmd/internal/patch-e2e -count=1
          GOFLAGS=-tags=preview go test -v -race ./cmd/internal/patch-e2e -count=1

      - name: Test one-line installer
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            system_bin_mode="$(stat -c '%a' /usr/local/bin)"
            trap 'sudo chmod "$system_bin_mode" /usr/local/bin' EXIT
            sudo chmod a-w /usr/local/bin
            sh scripts/test-install.sh --require-fallback
          else
            sh scripts/test-install.sh
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  generator-gate:
    name: API Generator Gate (${{ matrix.channel }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, preview]
    env:
      GOFLAGS: ${{ matrix.channel == 'preview' && '-tags=preview' || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: Validate all effective API metadata
        run: go run ./cmd/internal/apipatch check-all

      # Mapping, Cobra, command metadata and overlay tests are included in the
      # complete race/coverage suite above; do not run those tests a second time.
      - name: Generator outputs are up to date
        run: go run ./cmd/internal/cobragen check

      - name: Validate complete Patch coverage (no credentials)
        if: matrix.channel == 'stable'
        run: go run ./cmd/internal/apipatch coverage

      - name: Docs and man pages can be regenerated
        run: |
          set -euo pipefail
          tmpdocs="$(mktemp -d)"
          tmpman="$(mktemp -d)"
          go build -o "$RUNNER_TEMP/docgen" ./cmd/internal/docgen
          "$RUNNER_TEMP/docgen" markdown --dir "$tmpdocs"
          "$RUNNER_TEMP/docgen" man --dir "$tmpman"
          test -n "$(find "$tmpdocs" -mindepth 1 -maxdepth 1 -type f -print -quit)"
          test -n "$(find "$tmpman" -mindepth 1 -maxdepth 1 -type f -print -quit)"

  release-ready:
    name: Release Ready (${{ matrix.channel }}, ${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, preview]
        platform: [linux, darwin, windows]
    env:
      GOFLAGS: ${{ matrix.channel == 'preview' && '-tags=preview' || '' }}
      TARGET_OS: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: Build target platforms
        run: |
          set -euo pipefail
          mkdir -p build
          # Fixed metadata lets repeated builds reuse Go's link cache too.
          LDFLAGS="-X main.Version=v0.0.0-ci -X main.Commit=$(git rev-parse --short HEAD) -X main.BuildTime=$(git show -s --format=%cI HEAD)"
          arches=(amd64 arm64)
          ext=""
          if [[ "$TARGET_OS" == windows ]]; then arches=(amd64); ext=".exe"; fi
          for arch in "${arches[@]}"; do
            GOOS="$TARGET_OS" GOARCH="$arch" go build -ldflags "$LDFLAGS" -o "build/agr-${TARGET_OS}-${arch}${ext}" ./cmd/agr
          done

      - name: agr version smoke test
        if: matrix.platform == 'linux'
        run: |
          ./build/agr-linux-amd64 version
          ./build/agr-linux-amd64 version -o json | grep -q '"Version":"v0.0.0-ci"'
          ./build/agr-linux-amd64 schema instance.create -o json | grep -q '"Name":"instance.create"'

  # Keep this display name stable: the default-branch ruleset requires it.
  # Do not skip this workflow with on.paths: docs-only PRs still need a result.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - changes
      - checks
      - test
      - archive-compatibility
      - lint
      - generator-gate
      - release-ready
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required CI jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_CI: ${{ needs.changes.outputs.ci }}
        run: |
          jq -e '.changes.result == "success"' <<<"$NEEDS"
          if [[ "$RUN_CI" == true ]]; then
            jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
          elif [[ "$RUN_CI" == false ]]; then
            jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
          else
            echo "Missing change classification" >&2
            exit 1
          fi
