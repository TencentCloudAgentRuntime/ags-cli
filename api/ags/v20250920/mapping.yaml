        inputs:
          - flag: state
            type: json
      Metadata:
        inputs:
          - flag: metadata
            type: json

  DeleteSession:
    command: session.delete
    request: DeleteSessionRequest
    response: DeleteSessionResponse
    status: mapped

  DescribeSession:
    command: session.get
    request: DescribeSessionRequest
    response: DescribeSessionResponse
    status: mapped

  DescribeSessions:
    command: session.list
    request: DescribeSessionsRequest
    response: DescribeSessionsResponse
    status: mapped
    fields:
      UserIds:
        inputs:
          - flag: user-ids
            type: string_array
      SessionIds:
        inputs:
          - flag: session-ids
            type: string_array
      Filters:
        inputs:
          - flag: filters
            type: json

  ModifySession:
    command: session.update
