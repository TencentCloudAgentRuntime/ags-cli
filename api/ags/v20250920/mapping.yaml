    request: DescribeEventsRequest
    response: DescribeEventsResponse
    status: mapped

  StartSandboxInstance:
    command: instance.create
    request: StartSandboxInstanceRequest
    response: StartSandboxInstanceResponse
    status: mapped
    fields:
      ToolName:
        shorthand: t
        inputs:
          - flag: tool-name
            type: string
            shorthand: t
      MountOptions:
        inputs:
          - flag: mount-options
            type: json
      Timeout:
        inputs:
          - flag: timeout
            type: string
      AuthMode:
