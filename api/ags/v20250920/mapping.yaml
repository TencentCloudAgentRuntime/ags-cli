# AGR CLI mapping.yaml
#
# Anti-corruption mapping between the effective TencentCloud AGS API actions
# (api.json + api.patch.json) and AGR CLI resource commands.
#
# Status invariants (every action in the effective API MUST appear here):
#   - mapped:               exposed as a stable resource command.
#   - raw_only:             reachable only via `agr api call <Action>`.
#                           A reason is required.
#   - deferred_with_reason: intentionally not exposed yet.
#                           A reason is required.
#
# fields: by-need overrides (NextPlan §8). Members that should use the
# default behavior (canonical kebab-case long flag, no shorthand /
# aliases) MUST NOT appear here. Add an entry only when a field needs
# alias / shorthand / positional / excluded / non-default flag.
#
# Per-field overrides:
#   flag:       custom long flag name; canonical kebab-case becomes an alias automatically.
#   shorthand:  single-letter shorthand for cobra; conflicts within a command fail CI.
#   aliases:    extra long flags accepted by cobra alongside the canonical one.
#   positional: read this field from cobra args instead of a flag (still accepted via --request).
#   excluded:   suppress the cobra flag entirely; --request still accepts the field.
#               cannot be combined with flag / shorthand / aliases / positional.

api_version: "v20250920"

actions:
  AcquireDeploymentToken:
    request: AcquireDeploymentTokenRequest
    response: AcquireDeploymentTokenResponse
    status: raw_only
    reason: Deployment tokens are short-lived data-plane credentials acquired transparently by `agr deployment proxy`; they are not exposed as a resource command.

  CreateDeployment:
    command: deployment.create
    request: CreateDeploymentRequest
    response: CreateDeploymentResponse
    status: mapped
    fields:
      ScalingConfiguration:
        inputs:
          - flag: scaling-configuration
            type: json
      LifecycleConfiguration:
        inputs:
          - flag: lifecycle-configuration
            type: json
      AffinityConfiguration:
        inputs:
          - flag: affinity-configuration
            type: json
      Tags:
        inputs:
          - flag: tags
            type: json

  DeleteDeployment:
    command: deployment.delete
    request: DeleteDeploymentRequest
    response: DeleteDeploymentResponse
    status: mapped
    fields:
      DeploymentId:
        positional: true

  DescribeDeployment:
    command: deployment.get
    request: DescribeDeploymentRequest
    response: DescribeDeploymentResponse
    status: mapped
    fields:
      DeploymentId:
        positional: true

  DescribeDeploymentList:
    command: deployment.list
    request: DescribeDeploymentListRequest
    response: DescribeDeploymentListResponse
    status: mapped
    fields:
      Offset:
        inputs:
          - flag: offset
            type: int
      Limit:
        inputs:
          - flag: limit
            type: int
      Filters:
        inputs:
          - flag: filters
            type: json

  ModifyDeployment:
    command: deployment.update
    request: ModifyDeploymentRequest
    response: ModifyDeploymentResponse
    status: mapped
    fields:
      DeploymentId:
        positional: true
      ScalingConfiguration:
        inputs:
          - flag: scaling-configuration
            type: json
      LifecycleConfiguration:
        inputs:
          - flag: lifecycle-configuration
            type: json
      Tags:
        inputs:
          - flag: tags
            type: json

  CreateSessionSpace:
    command: session-space.create
    request: CreateSessionSpaceRequest
    response: CreateSessionSpaceResponse
    status: mapped
    fields:
      Tags:
        inputs:
          - flag: tags
            type: json

  DeleteSessionSpace:
    command: session-space.delete
    request: DeleteSessionSpaceRequest
    response: DeleteSessionSpaceResponse
    status: mapped

  DescribeSessionSpace:
    command: session-space.get
    request: DescribeSessionSpaceRequest
    response: DescribeSessionSpaceResponse
    status: mapped

  DescribeSessionSpaces:
    command: session-space.list
    request: DescribeSessionSpacesRequest
    response: DescribeSessionSpacesResponse
    status: mapped

  ModifySessionSpace:
    command: session-space.update
    request: ModifySessionSpaceRequest
    response: ModifySessionSpaceResponse
    status: mapped

  CreateSession:
